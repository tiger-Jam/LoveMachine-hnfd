name: Build & publish Docker image (train daemon)

  on:
    push:
      branches: [main]
      paths:
        - 'install/Dockerfile.daemon'
        - 'daemon/**'
        - 'cpp_port/**'
        - '.github/workflows/build-docker.yml'
    workflow_dispatch:

  permissions:
    contents: read
    packages: write

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Image tags
          id: meta
          run: |
            echo "tags=ghcr.io/${{ github.repository_owner }}/koikoi-trainer:latest" >> $GITHUB_OUTPUT
            echo "sha_tag=ghcr.io/${{ github.repository_owner }}/koikoi-trainer:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

        - name: Build & push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: install/Dockerfile.daemon
            push: true
            platforms: linux/amd64
            tags: |
              ${{ steps.meta.outputs.tags }}
              ${{ steps.meta.outputs.sha_tag }}
            build-args: |
              REPO_URL=https://github.com/${{ github.repository }}.git
              REPO_REF=${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
