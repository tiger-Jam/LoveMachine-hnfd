name: docker-build

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    packages: write

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}

        - name: Login GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: install/Dockerfile.daemon
            push: true
            platforms: linux/amd64
            tags: |
              ghcr.io/${{ github.repository_owner }}/koikoi-trainer:latest
            build-args: |
              REPO_URL=https://github.com/${{ github.repository }}.git
              REPO_REF=${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
