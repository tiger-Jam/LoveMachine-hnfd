; M5Stack TAB5 用 Koi-Koi Trainer ダッシュボード firmware
; ESP32-P4 (main) + ESP32-C6 (WiFi)
;
; ビルド (PlatformIO):
;   pio run -e tab5            # firmware build
;   pio run -e tab5 -t upload  # USB-C 経由 flash
;
; あるいは GitHub Actions で .bin をリリースし、M5Burner で焼く。

; M5Stack TAB5 (ESP32-P4 + ESP32-C6) 用設定。
; PlatformIO 標準の espressif32 platform は ESP32-P4 (RISC-V) 未対応のため、
; pioarduino フォークを使う (Arduino-ESP32 v3.3.x ベース、ESP32-P4 対応済)。
;
; 参考: https://github.com/pioarduino/platform-espressif32

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DUSE_M5UNIFIED
  -DCORE_DEBUG_LEVEL=3
  -DARDUINOJSON_USE_LONG_LONG=1
  -DBOARD_HAS_PSRAM
  -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
  m5stack/M5Unified @ ^0.2.5
  bblanchon/ArduinoJson @ ^7.4.2
