; M5Stack TAB5 用 Koi-Koi Trainer ダッシュボード firmware
; ESP32-P4 (main) + ESP32-C6 (WiFi)
;
; ビルド (PlatformIO):
;   pio run -e tab5            # firmware build
;   pio run -e tab5 -t upload  # USB-C 経由 flash
;
; あるいは GitHub Actions で .bin をリリースし、M5Burner で焼く。

[env:tab5]
platform = espressif32 @ ^6.7.0
board = m5stack-core2          ; TAB5 公式 board 定義は限定的なので、近い board を流用
framework = arduino

; ESP32-P4 フル対応版が出れば board = m5stack-tab5 に切替
; board_build.partitions = default_8MB.csv
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DUSE_M5UNIFIED
  -DCORE_DEBUG_LEVEL=3
  -DARDUINOJSON_USE_LONG_LONG=1
  -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
  m5stack/M5Unified @ ^0.2.5
  lovyan03/LovyanGFX @ ^1.2.0
  bblanchon/ArduinoJson @ ^7.4.2
  https://github.com/tzapu/WiFiManager.git
